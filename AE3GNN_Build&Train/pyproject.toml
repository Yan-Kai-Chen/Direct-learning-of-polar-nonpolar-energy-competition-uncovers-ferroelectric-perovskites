[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ae3gnn"
version = "1.0.0"
description = "Angular equivariant GNN for polar-nonpolar pair-energy learning"
requires-python = ">=3.10"
dependencies = [
  "ase>=3.22",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
